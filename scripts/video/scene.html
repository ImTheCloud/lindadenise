<!doctype html>
<!-- Scène de la vidéo du site (carrée, 57 s) : rendue image par image par rendu.mjs (voir l'en-tête de ce fichier-là). -->
<html>
<head>
<meta charset="utf-8">
<style>
  /* Polices du site (Fontsource, installées par npm). Le « z » de Gochi Hand ressemble à un « 3 » : il est pris dans Itim, comme sur le site. */
  @font-face { font-family: 'Gochi Hand'; src: url('../../node_modules/@fontsource/gochi-hand/files/gochi-hand-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Itim'; src: url('../../node_modules/@fontsource/itim/files/itim-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Titre z'; src: url('../../node_modules/@fontsource/itim/files/itim-latin-400-normal.woff2') format('woff2'); unicode-range: U+007A; }
  :root {
    --orange-fonce: #b05200; --orange-titre: #e0780c; --vert: #3e9a47; --vert-fonce: #2b6e3a; --encre: #2b3b2b;
    --titre: 'Titre z', 'Gochi Hand', cursive; --texte: 'Itim', sans-serif;
  }
  html, body { margin: 0; padding: 0; background: #fff; overflow: hidden; }
  #scene { position: relative; width: 1080px; height: 1080px; overflow: hidden; background: #fff; }
  #scene > *, .plan > * { position: absolute; }
  svg { display: block; }
  .decor { left: 0; top: 0; }

  /* Carte d'une œuvre : la carte blanche au bord vert du site (global.css, .carte), agrandie pour une image de 1080 px */
  .carte { left: 50%; top: 28px; translate: -50% 0; padding: 22px; background: #fff; border: 7px solid var(--vert-fonce); border-radius: 56px 24px 48px 28px / 28px 52px 24px 56px; box-shadow: 0 12px 0 rgba(43, 110, 58, 0.12); }
  .carte__image { position: relative; width: 432px; height: 611px; }
  .carte__image img { display: block; width: 432px; height: 611px; object-fit: cover; border-radius: 24px 12px 24px 16px / 16px 24px 12px 24px; }
  .carte__image .film { display: none; border-radius: 8px; }
  /* une toile : bord d'aluminium du site (global.css, .carte--toile), sans verre ni reflet */
  .carte--toile .carte__image img { border-radius: 6px; background: #dfe3e6; box-shadow: 0 0 0 2px #c3c9cd, 0 0 0 6px #eef1f3, 0 0 0 9px #9aa2a8, 0 18px 30px -12px rgba(60, 40, 20, 0.35); }
  .carte__etiquette { position: absolute; left: -14px; top: 22px; padding: 6px 26px 9px; font: 40px/1.1 var(--titre); color: #fff; background: var(--vert-fonce); border: 4px solid #fff; border-radius: 0 22px 22px 0; box-shadow: 0 4px 8px rgba(60, 40, 20, 0.3); }
  .carte--toile .carte__etiquette, .carte--film .carte__etiquette { background: var(--orange-fonce); }

  /* Textes sous l'œuvre : une ligne de titre (Gochi Hand), puis une ou deux phrases (Itim) */
  .l1, .l2 { left: 50px; width: 980px; margin: 0; text-align: center; text-wrap: balance; }
  .l1 { font: 96px/1 var(--titre); color: var(--vert-fonce); }
  .l1--rubrique { color: var(--orange-titre); }
  .l2 { font: 58px/1.18 var(--texte); color: var(--encre); white-space: pre-line; }
  .nom .vert { color: var(--vert); } .nom .orange { color: var(--orange-titre); }

  /* Fin */
  .fin__logo { left: 50%; top: 70px; translate: -50% 0; width: 150px; height: 150px; }
  .fin__nom { top: 250px; font-size: 150px; }
  .fin__message { top: 430px; }
  .fin__appel { top: 600px; font-size: 84px; color: var(--orange-fonce); }
  .tilleul { left: 0; top: 0; width: 1080px; height: 280px; transform-origin: 100% 100%; }
</style>
</head>
<body>
<div id="scene"></div>
<script>
const P = new URLSearchParams(location.search);
const LANG = P.get('lang') || 'fr';
const FILM = P.get('film'); // dossier des images du plan filmé (préparées par rendu.mjs)
const W = 1080, H = 1080;
const REPO = new URL('../..', location.href).href.replace(/\/$/, '');
const NS = 'http://www.w3.org/2000/svg';
const scene = document.getElementById('scene');

// Textes à l'écran, tous repris du site (src/i18n/fr.ts et nl.ts) ; titres des dessins dans src/data/dessins.json.
// Ni prix, ni remise, ni chiffres qui vieillissent, ni Ostende.
const T = {
  fr: {
    ouverture: 'Dessins numériques faits à la main', // meta.description
    bonjour: 'Bonjour, je suis Linda', belgique: 'Je vis en Belgique.', // page À propos (mots de Linda)
    smartphone: 'En 2022, j’ai eu mon premier smartphone.', depuis: 'Depuis, j’adore dessiner.',
    beaute: 'Je cherche à dessiner la beauté de la nature et des chats.',
    rubriques: { chats: 'Les chats', nature: 'La nature', fleurs: 'Les fleurs', animaux: 'Les animaux', psaumes: 'Les psaumes' },
    versets: 'Des versets mis en dessin par Linda', // rubrique Psaumes
    dessin: 'Dessin', toile: 'Toile', toiles: 'Les toiles',
    aluminium: 'Des dessins imprimés sur aluminium', // page Toiles (meta)
    unique: 'Chaque toile déjà imprimée est une pièce unique.', // conditions de vente des toiles
    commande: 'Toile sur commande', enGrand: 'Un dessin vous plaît en grand ?', imprimer: 'Linda peut le faire imprimer en toile.', // panier, Tilleul
    message: 'Linda répond elle-même\nà chaque message.', ecrire: 'Écrivez-lui !', // Tilleul
  },
  nl: {
    ouverture: 'Digitale tekeningen, met de hand gemaakt',
    bonjour: 'Hallo, ik ben Linda', belgique: 'Ik woon in België.',
    smartphone: 'In 2022 kreeg ik mijn eerste smartphone.', depuis: 'Sindsdien teken ik met veel plezier.',
    beaute: 'Ik probeer de schoonheid van de natuur en van katten te tekenen.',
    rubriques: { chats: 'De katten', nature: 'De natuur', fleurs: 'De bloemen', animaux: 'De dieren', psaumes: 'De psalmen' },
    versets: 'Verzen getekend door Linda',
    dessin: 'Tekening', toile: 'Doek', toiles: 'De doeken',
    aluminium: 'Tekeningen gedrukt op aluminium',
    unique: 'Elk doek dat al gedrukt is,\nis een uniek stuk.',
    commande: 'Doek op bestelling', enGrand: 'Wil je een tekening in het groot?', imprimer: 'Linda kan ze als doek laten drukken.',
    message: 'Linda beantwoordt zelf\nelk bericht.', ecrire: 'Schrijf haar!',
  },
}[LANG];
const dessins = (() => { const x = new XMLHttpRequest(); x.open('GET', `${REPO}/src/data/dessins.json`, false); x.send(); return JSON.parse(x.responseText); })();
const titre = (id) => dessins.find((d) => d.id === id).titre[LANG].replace(/'/g, '’');
const R = T.rubriques;

// Déroulé : une mesure de musique = 3 s ; chaque changement tombe au début d'une mesure, fondu enchaîné de 0,6 s.
// art : un dessin, la toile filmée ou une photo de toile ; l1 : ligne de titre ; l2 : phrases ; ajout : phrase qui s'ajoute en cours de plan.
const PLANS = [
  { a: 0, b: 3, art: { dessin: 'tiroux-et-les-arbres' }, nom: true, l2: [T.ouverture] },
  { a: 3, b: 6, art: { dessin: 'chapeau-de-soleil' }, l1: T.bonjour, l2: [T.belgique] },
  { a: 6, b: 12, art: { dessin: 'couleurs' }, l2: [T.smartphone], ajout: [9, T.depuis] },
  { a: 12, b: 18, art: { dessin: 'tiroux-et-les-couleurs' }, l2: [T.beaute] },
  { a: 18, b: 21, art: { dessin: 'time-au-clair-de-lune' }, l1: R.chats, rubrique: true, l2: [titre('time-au-clair-de-lune')] },
  { a: 21, b: 24, art: { dessin: 'time-grimpe' }, l1: R.chats, rubrique: true, l2: [titre('time-grimpe')] },
  { a: 24, b: 27, art: { dessin: 'l-ile-de-brehat' }, l1: R.nature, rubrique: true, l2: [titre('l-ile-de-brehat')] },
  { a: 27, b: 30, art: { dessin: 'marrons' }, l1: R.nature, rubrique: true, l2: [titre('marrons')] },
  { a: 30, b: 33, art: { dessin: 'lys-tigre' }, l1: R.fleurs, rubrique: true, l2: [titre('lys-tigre')] },
  { a: 33, b: 36, art: { dessin: 'coccinelles' }, l1: R.animaux, rubrique: true, l2: [titre('coccinelles')] },
  { a: 36, b: 39, art: { dessin: 'plante-pres-du-ruisseau' }, l1: R.psaumes, rubrique: true, l2: [T.versets] }, // titre du psaume pas encore validé : non affiché
  { a: 39, b: 42, art: { film: true }, l1: T.toiles, l2: [T.aluminium] },
  { a: 42, b: 45, art: { toile: 'mauves' }, l1: T.toiles, l2: [T.unique] },
  { a: 45, b: 51, art: { dessin: 'trio-glaieuls' }, l1: T.commande, l2: [T.enGrand], ajout: [48, T.imprimer] },
  { a: 51, b: 57, fin: true },
];
const DUREE = 57, FONDU = 0.6;
const FILM_IMAGES = 63; // 2,1 s filmées à 30 images/s, montrées au ralenti pendant que la toile est à l'écran (3,6 s)

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const ss = (x) => x * x * (3 - 2 * x); // fondu doux
function el(tag, attrs = {}, parent = scene, texte) {
  const e = tag.startsWith('svg:') ? document.createElementNS(NS, tag.slice(4)) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (texte !== undefined) e.textContent = texte;
  if (parent) parent.appendChild(e);
  return e;
}

// ---------- décor : feuilles de tilleul qui tombent doucement sur les côtés, étang et lotus en bas ----------
const FEUILLE = 'M50,6 C64,28 88,40 83,64 C80,80 62,85 50,75 C38,85 20,80 17,64 C12,40 36,28 50,6 Z';
function feuilles(parent) {
  const liste = [];
  const COUL = ['#3E9A47', '#F28A1E', '#FFB347', '#2B6E3A'];
  for (let i = 0; i < 8; i++) {
    const k = ((i * 9301 + 4927) % 233280) / 233280;
    const g = el('svg:g', {}, parent);
    el('svg:path', { d: FEUILLE, fill: COUL[i % 4] }, g);
    el('svg:path', { d: 'M50,74 L50,26 M50,56 L36,42 M50,56 L64,42', stroke: '#fff', 'stroke-width': 4, 'stroke-linecap': 'round', fill: 'none', opacity: 0.6 }, g);
    const gauche = i % 2 === 0;
    liste.push({ g, x0: gauche ? 40 + k * 170 : 870 + k * 170, taille: 0.38 + k * 0.2, vitesse: 34 + k * 22, dephasage: k * 40 + i * 3.1, dx: 20 + k * 25 });
  }
  return (t) => liste.forEach((f) => {
    const course = 820;
    const y = ((t * f.vitesse + f.dephasage * 37) % course) - 80;
    const x = f.x0 + Math.sin(t * 0.8 + f.dephasage) * f.dx;
    f.g.setAttribute('opacity', (1 - ss(prog(y, 600, 700))).toFixed(3)); // s'effacent avant la zone des textes
    f.g.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${((t * 30 + f.dephasage * 20) % 360).toFixed(1)}) scale(${f.taille.toFixed(3)}) translate(-50,-50)`);
  });
}
const PET = 'M0,0 C-27,-18 -29,-60 0,-94 C29,-60 27,-18 0,0 Z';
const PETALES = [[-80, 0.78, '#FFB347'], [80, 0.78, '#FFB347'], [-52, 0.92, '#F28A1E'], [52, 0.92, '#F28A1E'], [-24, 1, '#F7992B'], [24, 1, '#F7992B'], [0, 1.06, '#F28A1E']];
function lotus(parent, x, y, s) {
  const g = el('svg:g', {}, parent);
  el('svg:ellipse', { cx: 0, cy: 6, rx: 95, ry: 20, fill: '#3e9a47' }, g);
  el('svg:path', { d: 'M0,6 L95,0 L60,22 Z', fill: '#8fcfb4' }, g);
  for (const [a, k, c] of PETALES) {
    const p = el('svg:g', { transform: `rotate(${a}) scale(${k})` }, g);
    el('svg:path', { d: PET, fill: c }, p);
    el('svg:path', { d: 'M0,-10 C-4,-36 -3,-62 0,-82', fill: 'none', stroke: '#FFD9A3', 'stroke-width': 3, 'stroke-linecap': 'round', opacity: 0.6 }, p);
  }
  return (t, ph) => g.setAttribute('transform', `translate(${x},${(y + Math.sin(t * 1.1 + ph) * 3).toFixed(2)}) rotate(${(Math.sin(t * 0.7 + ph) * 2.5).toFixed(2)}) scale(${s})`);
}
const EAU = 1000; // ligne de l'eau : l'étang occupe le bas de l'image, sous la barre du lecteur (aucun texte)
function etang(parent) {
  const defs = el('svg:defs', {}, parent);
  const grad = el('svg:linearGradient', { id: 'eau', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el('svg:stop', { offset: 0, 'stop-color': '#bfe6d3' }, grad);
  el('svg:stop', { offset: 1, 'stop-color': '#7cc3a4' }, grad);
  const eau = el('svg:path', { fill: 'url(#eau)' }, parent);
  const fleurs = [[110, 34, 0.42, 0], [330, 52, 0.5, 2], [560, 38, 0.4, 4]].map(([x, dy, s, ph]) => [lotus(parent, x, EAU + dy, s), ph]);
  return (t) => {
    let d = `M0,${H} L0,${EAU}`;
    for (let x = 0; x <= W; x += 30) d += ` L${x},${(EAU + Math.sin(x / 120 + t * 1.1) * 5).toFixed(1)}`;
    eau.setAttribute('d', d + ` L${W},${H} Z`);
    fleurs.forEach(([f, ph]) => f(t, ph));
  };
}

// ---------- éléments d'un plan ----------
function carte(art) {
  const c = el('div', { class: `carte ${art.dessin ? 'carte--dessin' : art.film ? 'carte--film' : 'carte--toile'}` });
  const boite = el('div', { class: 'carte__image' }, c);
  let images = [];
  if (art.dessin) images = [el('img', { src: `${REPO}/public/dessins/${art.dessin}.webp`, alt: '' }, boite)];
  if (art.toile) images = [el('img', { src: `${REPO}/public/toiles/${art.toile}-1000.webp`, alt: '' }, boite)];
  if (art.film) {
    for (let i = 1; i <= FILM_IMAGES; i++) images.push(el('img', { class: 'film', src: `file://${FILM}/${String(i).padStart(3, '0')}.png`, alt: '' }, boite));
  }
  el('span', { class: 'carte__etiquette' }, boite, art.dessin ? T.dessin : T.toile);
  return { el: c, images };
}
// Place les textes d'un plan les uns sous les autres, à partir du haut de la zone des textes
const HAUT_TEXTES = 716;
function textes(plan) {
  const liste = [];
  let y = HAUT_TEXTES;
  const poser = (e, ecart) => { e.style.top = `${y}px`; y += e.offsetHeight + ecart; return e; };
  if (plan.nom) {
    const n = el('p', { class: 'l1 nom' });
    el('span', { class: 'vert' }, n, 'Linda'); n.append(' '); el('span', { class: 'orange' }, n, 'Denise');
    liste.push({ cle: 'nom', e: poser(n, 10) });
  }
  if (plan.l1) liste.push({ cle: `l1:${plan.l1}`, e: poser(el('p', { class: `l1${plan.rubrique ? ' l1--rubrique' : ''}` }, scene, plan.l1), 10) });
  for (const p of plan.l2) liste.push({ cle: `l2:${p}:${plan.a}`, e: poser(el('p', { class: 'l2' }, scene, p), 4) });
  if (plan.ajout) liste.push({ cle: `ajout:${plan.ajout[1]}`, e: poser(el('p', { class: 'l2' }, scene, plan.ajout[1]), 4), a: plan.ajout[0] });
  const bas = Math.max(...liste.map((x) => x.e.offsetTop + x.e.offsetHeight));
  if (bas > EAU - 30) console.log(`Textes trop bas au plan de ${plan.a} s : ils descendent jusqu'à ${bas}px`);
  return liste;
}

// ================= Montage (construit une fois les polices chargées : les textes sont mesurés) =================
window.pret = (async () => {
  await Promise.all(['96px "Gochi Hand"', '58px "Itim"', '58px "Titre z"'].map((f) => document.fonts.load(f, 'Az')));

  const decor = el('svg:svg', { class: 'decor', width: W, height: H, viewBox: `0 0 ${W} ${H}` });
  const tombe = feuilles(decor);
  const eau = etang(decor);

  // Pistes : une œuvre, puis chaque ligne de texte. Deux plans qui se suivent avec la même ligne (« Les chats ») la gardent
  // telle quelle, sans fondu. Une carte reste entière sous la suivante pendant que celle-ci apparaît (pas de creux).
  const cartes = [], lignes = [];
  let fin = null;
  for (const plan of PLANS) {
    if (plan.fin) { fin = plan; continue; }
    cartes.push({ a: plan.a, b: plan.b, film: !!plan.art.film, ...carte(plan.art) });
    for (const x of textes(plan)) {
      const avant = lignes.find((l) => l.cle === x.cle && l.b === plan.a);
      if (avant) { avant.b = plan.b; x.e.remove(); } else lignes.push({ cle: x.cle, a: x.a ?? plan.a, b: plan.b, e: x.e });
    }
  }

  // Fin : le logo, « Linda Denise », l'invitation à écrire à Linda (texte simple : Tilleul ne parle pas), Tilleul assis au bord de l'étang
  const finG = el('div', { class: 'plan' });
  finG.style.cssText = 'position:absolute;inset:0';
  el('img', { class: 'fin__logo', src: `${REPO}/public/favicon.svg`, alt: '' }, finG);
  const nom = el('p', { class: 'l1 nom fin__nom' }, finG);
  el('span', { class: 'vert' }, nom, 'Linda'); nom.append(' '); el('span', { class: 'orange' }, nom, 'Denise');
  el('p', { class: 'l2 fin__message' }, finG, T.message);
  el('p', { class: 'l1 fin__appel' }, finG, T.ecrire);
  const bande = el('svg:svg', { class: 'tilleul', width: W, height: 280 }, finG);
  const chat = new Tilleul.Chat(bande, { decor: { lotus: () => [], feuilles: () => [] }, libre: false, reduit: false, dort: false, toucher() {}, taire() {}, suit() {} });
  chat.retenu = true; // il garde sa pose assise jusqu'à la fin et regarde le visiteur (il ne parle pas : pas de bulle)
  chat.x = chat.cibleX = 925; // un peu à gauche de son coin habituel : sa queue reste dans l'image
  bande.style.transform = `translateY(${EAU + 6 - 280}px) scale(1.7)`;

  const rendre = (t) => {
    tombe(t); eau(t);
    cartes.forEach((c, i) => {
      const suivante = cartes[i + 1];
      const tient = suivante && suivante.a === c.b; // la suivante la recouvre : elle reste entière dessous
      const entree = c.a === 0 ? 1 : ss(prog(t, c.a, c.a + FONDU));
      const sortie = tient ? (t < c.b + FONDU ? 1 : 0) : 1 - ss(prog(t, c.b, c.b + FONDU));
      const op = t < c.a ? 0 : entree * sortie;
      c.el.style.opacity = op.toFixed(3);
      c.el.style.display = op > 0 ? 'block' : 'none';
      c.el.style.zIndex = 10 + i;
      if (c.film && op > 0) {
        const k = Math.min(FILM_IMAGES - 1, Math.floor(prog(t, c.a, c.b + FONDU) * FILM_IMAGES));
        c.images.forEach((img, j) => { img.style.display = j === k ? 'block' : 'none'; });
      }
    });
    lignes.forEach((l) => {
      // un texte s'efface avant que le suivant apparaisse à la même place : jamais deux phrases l'une sur l'autre
      const entree = l.a === 0 ? ss(prog(t, 0.2, 0.8)) : ss(prog(t, l.a + 0.25, l.a + FONDU));
      const op = t < l.a ? 0 : entree * (1 - ss(prog(t, l.b, l.b + 0.3)));
      l.e.style.opacity = op.toFixed(3);
      l.e.style.display = op > 0 ? 'block' : 'none';
      l.e.style.zIndex = 50;
    });
    const opFin = ss(prog(t, fin.a + 0.25, fin.a + FONDU)); // comme les textes : la fin arrive quand le dernier texte est parti
    finG.style.opacity = opFin.toFixed(3);
    finG.style.display = opFin > 0 ? 'block' : 'none';
    finG.style.zIndex = 60;
  };
  window.DUREE = DUREE;
  window.image = (t) => { avancer(1000 / 30); rendre(t); };

  // toutes les images chargées et décodées avant la première capture
  await Promise.all([...scene.querySelectorAll('img')].map((i) => i.decode().catch(() => console.log('Image illisible :', i.src))));
  return true;
})();
</script>
</body>
</html>
