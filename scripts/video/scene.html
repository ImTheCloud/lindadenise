<svg id="racine" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const P = new URLSearchParams(location.search);
const LANG = P.get('lang') || 'fr';
const W = 1920, H = 1080;
const REPO = new URL('../..', location.href).href.replace(/\/$/, '');

const racine = document.getElementById('racine');
racine.setAttribute('width', W); racine.setAttribute('height', H); racine.setAttribute('viewBox', `0 0 ${W} ${H}`);

const BLANC = '#fff', ORANGE = '#FFA52E', VERT_NUIT = '#1f5a2e';

// Textes (à l'écran : ni prix ni remise, rien sur Ostende, aucun chiffre ni « pièce unique »), repris du site : accroche,
// page À propos (les mots de Linda), textes des univers, caractéristiques des toiles, accueil. Il y a toujours un texte à l'écran.
// Légendes en bas : [début, fin, texte, en orange].
const T = {

      [8.6, 9.6, 'esthetisch', true], [9.6, 10.6, 'rustgevend', true], [10.6, 11.6, 'naïef', true], [11.6, 12.6, 'vrolijk', true],
      [12.6, 13.6, 'kleurrijk', true], [13.6, 14.6, 'levendig', true], [14.6, 16.0, 'en eigenzinnig', true],
      [34.2, 35.8, 'Sommige van haar tekeningen', false], [35.8, 37.4, 'groot gedrukt', true], [37.4, 38.8, 'op aluminium', false],
      [38.8, 40.6, 'A3-formaat, 29,7 × 42 cm', true], [40.6, 42.0, 'Matte afwerking', false], [42.0, 43.6, 'Ingebouwde ophanghaak', true],
      [43.6, 46.2, 'om thuis op te hangen', false],
    ],
    univers: ['Meerdere werelden', 'bedacht door Linda'],
    noms: { chats: 'De katten', nature: 'De natuur', fleurs: 'De bloemen', animaux: 'De dieren', psaumes: 'De psalmen' },
    phrases: {
      chats: 'De katten van een vriend uit Quebec: ze klimmen, dromen en luieren',
      nature: 'Bomen, bossen, rivieren en de kust, zoals Linda ze ziet',
      fleurs: 'Zonnebloemen, tulpen, lelies en gladiolen in volle kleur',
      animaux: 'Eekhoorns, een pauw, een schildpad en kleine tuindiertjes',
      psaumes: 'Verzen uit de Psalmen, getekend door Linda',
    },
    fin: [['Een tekening is', 'een moment van rust'], ['om te houden', 'of te geven'], ['Vind er een die', 'je muren tot leven brengt'], ['Kom binnen, kijk rond,', 'haal adem.']],
  },
}[LANG];

// Les œuvres montrées : aperçus filigranés des dessins numériques et photos des toiles (pas toutes : un choix varié)
const DESSINS_MUR = ['tiroux-et-les-arbres', 'tournesol', 'chapeau-de-soleil', 'paon-indien', 'tiroux-et-les-couleurs', 'trio-glaieuls',
  'time-grimpe', 'marrons', 'couleurs', 'soleil-couchant', 'arbre-rouge-et-lapins', 'trio-d-amaryllis'];
const DESSINS_UNIVERS = [['time-au-clair-de-lune', 'chats'], ['l-ile-de-brehat', 'nature'], ['lys-tigre', 'fleurs'], ['coccinelles', 'animaux'], ['plante-pres-du-ruisseau', 'psaumes']];
const TOILES_SALON = [['iris', 'le-tournesol', 'bouleaux-en-hiver'], ['tournesols', 'sweet', 'mauves']]; // au-dessus du buffet, puis du canapé

// ---------- outils ----------
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const io = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const ss = (x) => x * x * (3 - 2 * x); // fondu doux, sans à-coup au début ni à la fin
const sinus = (x) => 0.5 - 0.5 * Math.cos(Math.PI * x);
const out = (x) => 1 - Math.pow(1 - x, 3);
const outBack = (x) => { const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function el(tag, attrs = {}, parent = racine) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
let uid = 0;
const id = (p) => `${p}${uid++}`;
const montrer = (g, v) => g.setAttribute('display', v ? 'inline' : 'none');

const defs = el('defs');
// texture d'enduit, calculée une seule fois
function texture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'); const img = x.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) { const v = 200 + Math.random() * 55; img.data[i] = v; img.data[i + 1] = v * 0.96; img.data[i + 2] = v * 0.88; img.data[i + 3] = 22; }
  x.putImageData(img, 0, 0); return c.toDataURL();
}
const motif = el('pattern', { id: 'enduit', width: 256, height: 256, patternUnits: 'userSpaceOnUse' }, defs);
el('image', { href: texture(), width: 256, height: 256 }, motif);
const ombre = el('filter', { id: 'ombre', x: '-20%', y: '-15%', width: '140%', height: '145%' }, defs);
el('feDropShadow', { dx: 0, dy: 14, stdDeviation: 16, 'flood-color': '#3a2a18', 'flood-opacity': 0.32 }, ombre);
const flou = el('filter', { id: 'flou', x: '-50%', y: '-50%', width: '200%', height: '200%' }, defs);
el('feGaussianBlur', { stdDeviation: 6 }, flou);
const gLumiere = el('radialGradient', { id: 'lumiere', cx: 0.5, cy: 0, r: 0.75 }, defs);
el('stop', { offset: 0, 'stop-color': '#fffaf0', 'stop-opacity': 0.95 }, gLumiere);
el('stop', { offset: 1, 'stop-color': '#fffaf0', 'stop-opacity': 0 }, gLumiere);

// Une toile accrochée à un clou : se peint au pinceau, puis se balance doucement.
// Un dessin (dessin = true) : même pinceau, dans la carte blanche au bord vert du site, sans clou.
function toile(parent, nom, largeur, dessin = false) {
  const l = largeur, h = Math.round(largeur * 420 / 297);
  const g = el('g', {}, parent);
  const corps = el('g', { filter: 'url(#ombre)' }, g);
  const masque = el('mask', { id: id('m'), maskUnits: 'userSpaceOnUse', x: -l, y: -h * 0.2, width: l * 3, height: h * 1.6 }, defs);
  // trait de pinceau en zigzag qui couvre la toile
  const rangs = 5, ep = h / rangs * 1.5;
  let d = '';
  for (let i = 0; i < rangs; i++) {
    const y = 18 + h * (i + 0.5) / rangs;
    const [a, b] = i % 2 ? [l * 1.08 - l / 2, -l * 1.08 + l / 2] : [-l * 0.58, l * 0.58];
    d += (i ? ` L${a},${y}` : `M${a},${y}`) + ` Q${(a + b) / 2},${y + (i % 2 ? -18 : 18)} ${b},${y}`;
  }
  const trait = el('path', { d, fill: 'none', stroke: '#fff', 'stroke-width': ep, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', pathLength: 1, 'stroke-dasharray': '1 1', 'stroke-dashoffset': 1 }, masque);
  const peint = el('g', { mask: `url(#${masque.id})` }, corps);
  let clou = null;
  if (dessin) {
    el('rect', { x: -l / 2 - 12, y: 6, width: l + 24, height: h + 24, rx: 18, fill: '#fff', stroke: '#2b6e3a', 'stroke-width': 6 }, peint);
    el('image', { href: `${REPO}/public/dessins/${nom}.webp`, x: -l / 2, y: 18, width: l, height: h, preserveAspectRatio: 'xMidYMid slice' }, peint);
  } else {
    el('rect', { x: -l / 2 - 3, y: 15, width: l + 6, height: h + 6, rx: 3, fill: '#c9ced2' }, peint);
    el('image', { href: `${REPO}/public/toiles/${nom}-800.webp`, x: -l / 2, y: 18, width: l, height: h, preserveAspectRatio: 'xMidYMid slice' }, peint);
    el('rect', { x: -l / 2, y: 18, width: l, height: h, fill: 'none', stroke: '#9aa2a8', 'stroke-width': 2 }, peint);
    clou = el('g', {}, g);
    el('circle', { cx: 1.5, cy: 3, r: 7, fill: '#000', opacity: 0.18, filter: 'url(#flou)' }, clou);
    el('circle', { cx: 0, cy: 0, r: 6.5, fill: '#9a9a9a' }, clou);
    el('circle', { cx: -1.8, cy: -1.8, r: 2.6, fill: '#fff', opacity: 0.85 }, clou);
  }
  return {
    l, h, g,
    // p : avancement du pinceau (0 à 1), b : temps depuis la fin de la peinture (balancement : il ne bouge pas avant)
    maj({ x, y, p = 1, b = 99, echelle = 1, pente = 0, opacite = 1 }) {
      const angle = pente + 4.5 * Math.exp(-Math.max(0, b) / 0.9) * Math.cos(Math.max(0, b) * 5.2);
      g.setAttribute('transform', `translate(${x.toFixed(2)},${y.toFixed(2)}) scale(${echelle.toFixed(4)})`);
      g.setAttribute('opacity', opacite.toFixed(3));
      corps.setAttribute('transform', `rotate(${angle.toFixed(3)})`);
      trait.setAttribute('stroke-dashoffset', (1 - p).toFixed(4));
      if (clou) clou.setAttribute('opacity', p > 0 ? 1 : 0);
    },
  };
}

// ---------- gros textes (style des vidéos courtes : gros titres qui sautent, mot après mot) ----------
// Chaque mot est dessiné deux fois (ombre dure, puis le mot avec son contour) et « saute » à son tour.
function mots(parent, texte, cx, cy, taille, { remplir = BLANC, contour = VERT_NUIT, largeurMax = W - 240 } = {}) {
  const g = el('g', {}, parent);
  const liste = texte.split(' ');
  const sonde = el('text', { 'font-size': taille }, g);
  const larg = liste.map((m) => { sonde.textContent = m; return sonde.getComputedTextLength(); });
  g.removeChild(sonde);
  const espace = taille * 0.28;
  const total = larg.reduce((a, b) => a + b, 0) + espace * (liste.length - 1);
  const k = Math.min(1, largeurMax / total);
  const t2 = taille * k;
  let x = cx - total * k / 2;
  const motsListe = liste.map((m, i) => {
    const mx = x + larg[i] * k / 2; x += (larg[i] + espace) * k;
    const mg = el('g', { opacity: 0 }, g);
    const attrs = { x: 0, y: 0, 'font-size': t2, 'text-anchor': 'middle', 'stroke-linejoin': 'round', 'stroke-width': t2 * 0.18, 'paint-order': 'stroke' };
    el('text', { ...attrs, fill: contour, stroke: contour, transform: `translate(0,${t2 * 0.08})` }, mg).textContent = m;
    el('text', { ...attrs, fill: Array.isArray(remplir) ? remplir[i] : remplir, stroke: contour }, mg).textContent = m;
    return { mg, mx, rot: i % 2 ? 3 : -3 };
  });
  return {
    g,
    maj(p) { // p : 0 (rien) à 1 (tous les mots posés)
      const n = motsListe.length;
      motsListe.forEach((w, i) => {
        const q = prog(p, (i / n) * 0.55, (i / n) * 0.55 + 0.45);
        w.mg.setAttribute('opacity', Math.min(1, q * 5).toFixed(3));
        w.mg.setAttribute('transform', `translate(${w.mx.toFixed(1)},${(cy + (1 - q) * 46).toFixed(1)}) rotate(${(w.rot * (1 - q)).toFixed(2)}) scale(${Math.max(0, outBack(q)).toFixed(4)})`);
      });
    },
  };
}

// Un titre sur une ou deux lignes (coupé au mot qui équilibre les deux lignes)
function titre(parent, texte, cx, cy, taille, largeurMax, remplir = BLANC) {
  const g = el('g', {}, parent);
  const m = texte.split(' ');
  let lignes = [texte];
  if (texte.length > 13 && m.length > 1) {
    let meilleur = 1;
    for (let s = 1; s < m.length; s++) if (Math.abs(m.slice(0, s).join(' ').length - m.slice(s).join(' ').length) < Math.abs(m.slice(0, meilleur).join(' ').length - m.slice(meilleur).join(' ').length)) meilleur = s;
    lignes = [m.slice(0, meilleur).join(' '), m.slice(meilleur).join(' ')];
  }
  const liste = lignes.map((l, j) => mots(g, l, cx, cy + (j - (lignes.length - 1) / 2) * taille * 1.02, taille, { largeurMax, remplir }));
  return { g, maj: (p) => liste.forEach((x, j) => x.maj(prog(p, j * 0.3, j * 0.3 + 0.7))) };
}

// Légendes : quelques mots à la fois, qui sautent puis s'effacent juste avant la suivante (jamais de vide) ;
// place(début) donne la hauteur, la taille et la largeur maximale du texte
function legendes(parent, morceaux, place) {
  const liste = morceaux.map(([a, b, texte, accent]) => {
    const { cy, taille, largeurMax } = place(a);
    const g = el('g', { display: 'none' }, parent);
    return { a, b, g, cy, n: texte.split(' ').length, m: mots(g, texte, W / 2, cy, taille, { remplir: accent ? ORANGE : BLANC, largeurMax }) };
  });
  return (t) => liste.forEach(({ a, b, g, cy, n, m }) => {
    const vis = t >= a && t < b;
    montrer(g, vis);
    if (!vis) return;
    m.maj(prog(t, a, a + 0.16 + 0.1 * n));
    const s = ss(prog(t, b - 0.12, b));
    g.setAttribute('opacity', (1 - s).toFixed(3));
    g.setAttribute('transform', `translate(${W / 2},${cy - 45}) scale(${(1 + 0.06 * s).toFixed(4)}) translate(${-W / 2},${-(cy - 45)})`);
  });
}

// ---------- décor ----------
const FEUILLE = 'M50,6 C64,28 88,40 83,64 C80,80 62,85 50,75 C38,85 20,80 17,64 C12,40 36,28 50,6 Z';
function feuilles(parent, n, seed) {
  const liste = [];
  for (let i = 0; i < n; i++) {
    const g = el('g', {}, parent);
    const c = ['#3E9A47', '#F28A1E', '#FFB347', '#2B6E3A'][(i + seed) % 4];
    el('path', { d: FEUILLE, fill: c }, g);
    el('path', { d: 'M50,74 L50,26 M50,56 L36,42 M50,56 L64,42', stroke: '#fff', 'stroke-width': 4, 'stroke-linecap': 'round', fill: 'none', opacity: 0.6 }, g);
    const k = (i * 9301 + seed * 49297) % 233280 / 233280;
    liste.push({ g, x0: (i + 0.5) / n * W + (k - 0.5) * 120, taille: 0.45 + k * 0.45, vitesse: 70 + k * 60, dephasage: k * 30, dx: 40 + k * 60 });
  }
  return (t) => liste.forEach((f) => {
    const y = ((t * f.vitesse + f.dephasage * 37) % (H + 200)) - 100;
    const x = f.x0 + Math.sin(t * 0.9 + f.dephasage) * f.dx;
    f.g.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(t * 40 + f.dephasage * 20) % 360} ) scale(${f.taille}) translate(-50,-50)`);
  });
}

const PET = 'M0,0 C-27,-18 -29,-60 0,-94 C29,-60 27,-18 0,0 Z';
const PETALES = [[-80, 0.78, '#FFB347'], [80, 0.78, '#FFB347'], [-52, 0.92, '#F28A1E'], [52, 0.92, '#F28A1E'], [-24, 1, '#F7992B'], [24, 1, '#F7992B'], [0, 1.06, '#F28A1E']];
function lotus(parent, x, y, s) {
  const g = el('g', {}, parent);
  el('ellipse', { cx: 0, cy: 6, rx: 95, ry: 20, fill: '#3e9a47' }, g);
  el('path', { d: 'M0,6 L95,0 L60,22 Z', fill: '#8fcfb4' }, g);
  for (const [a, k, c] of PETALES) {
    const p = el('g', { transform: `rotate(${a}) scale(${k})` }, g);
    el('path', { d: PET, fill: c }, p);
    el('path', { d: 'M0,-10 C-4,-36 -3,-62 0,-82', fill: 'none', stroke: '#FFD9A3', 'stroke-width': 3, 'stroke-linecap': 'round', opacity: 0.6 }, p);
  }
  return (t, ph) => g.setAttribute('transform', `translate(${x},${y + Math.sin(t * 1.3 + ph) * 5}) rotate(${Math.sin(t * 0.8 + ph) * 3}) scale(${s})`);
}
function etang(parent, y0) {
  const g = el('g', {}, parent);
  if (!document.getElementById('eau')) {
    const grad = el('linearGradient', { id: 'eau', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
    el('stop', { offset: 0, 'stop-color': '#bfe6d3' }, grad); el('stop', { offset: 1, 'stop-color': '#7cc3a4' }, grad);
  }
  const eau = el('path', { fill: 'url(#eau)' }, g);
  const roseaux = el('g', { stroke: '#2B6E3A', 'stroke-width': 6, 'stroke-linecap': 'round', fill: 'none' }, g);
  [[0.06, 1], [0.09, -1], [0.93, 1], [0.96, -1]].forEach(([fx, s]) => {
    const x = fx * W; el('path', { d: `M${x},${H} C${x - 6 * s},${y0 - 30} ${x + 8 * s},${y0 - 80} ${x},${y0 - 140}` }, roseaux);
    el('ellipse', { cx: x, cy: y0 - 150, rx: 9, ry: 24, fill: '#2B6E3A', stroke: 'none' }, roseaux);
  });
  const fleurs = [[0.22, 40, 0.55, 0], [0.5, 70, 0.8, 2], [0.78, 35, 0.6, 4]].map(([fx, dy, s, ph]) => [lotus(g, fx * W, y0 + dy, s), ph]);
  return (t) => {
    let d = `M0,${H} L0,${y0}`;
    for (let x = 0; x <= W; x += 40) d += ` L${x},${(y0 + Math.sin(x / 140 + t * 1.4) * 7).toFixed(1)}`;
    eau.setAttribute('d', d + ` L${W},${H} Z`);
    fleurs.forEach(([f, ph]) => f(t, ph));
  };
}

// Mur : enduit, lumière du haut, plinthe (le salon)
function mur(parent, x, y, l, h) {
  const g = el('g', {}, parent);
  el('rect', { x, y, width: l, height: h, fill: '#f3eee4' }, g);
  el('rect', { x, y, width: l, height: h, fill: 'url(#enduit)' }, g);
  el('rect', { x, y, width: l, height: h * 0.8, fill: 'url(#lumiere)' }, g);
  el('rect', { x, y: y + h - 70, width: l, height: 30, fill: '#fdfcf9' }, g);
  el('rect', { x, y: y + h - 42, width: l, height: 4, fill: '#d9cfbf' }, g);
  el('rect', { x, y: y + h - 38, width: l, height: 38, fill: '#e6cba0' }, g);
  return g;
}

function logo(parent) {
  const g = el('g', {}, parent);
  el('image', { href: `${REPO}/public/favicon.svg`, x: -110, y: -110, width: 220, height: 220 }, g);
  return g;
}

// Grain de lumière : petites poussières dorées qui flottent dans la lumière
function poussieres(parent, n) {
  const l = [];
  for (let i = 0; i < n; i++) {
    const k = ((i * 7919) % 1000) / 1000;
    const c = el('circle', { r: 2 + k * 3.5, fill: '#ffe2a8', filter: 'url(#flou)' }, parent);
    l.push({ c, x: k * W, y: ((i * 3571) % 1000) / 1000 * H * 0.7, v: 6 + k * 14, ph: k * 20 });
  }
  return (t, op) => l.forEach((p) => {
    p.c.setAttribute('cx', (p.x + Math.sin(t * 0.3 + p.ph) * 40).toFixed(1));
    p.c.setAttribute('cy', ((p.y - t * p.v) % (H * 0.7) + H * 0.7) % (H * 0.7));
    p.c.setAttribute('opacity', (op * (0.35 + 0.35 * Math.sin(t * 1.7 + p.ph))).toFixed(3));
  });
}

// ================= Montage (construit une fois les polices chargées : les mots sont mesurés) =================
window.pret = (async () => {
  await Promise.all([document.fonts.load('80px "Lilita One"'), document.fonts.load('100px "Gochi Hand"')]);

  // Tilleul : le moteur du site, inchangé
  const porteChat = el('g', {});
  const scene = el('svg', { width: W, height: 280, overflow: 'visible' }, porteChat);
  const chat = new Tilleul.Chat(scene, { decor: { lotus: () => [], feuilles: () => [] }, libre: true, reduit: false, dort: false, toucher() {}, taire() {}, suit() {} });
  scene.setAttribute('width', W); scene.setAttribute('height', 280);
  racine.removeChild(porteChat);
  let chatPret = false;
  // Positions dans le repère du moteur (largeur de l'écran, bande de 280 de haut)
  const chatEntre = (depart, cible) => { chat.ordre('assis'); chat.x = depart; chat.cibleX = cible; chat.etat = depart === cible ? 'assis' : 'marche'; };
  // Il suit le pointeur du regard : on « pointe » la toile
  const regarde = (x, y) => window.dispatchEvent(new PointerEvent('pointermove', { clientX: x, clientY: y }));

  const calques = { fond: el('g'), scene: el('g'), texte: el('g') };
  el('rect', { width: W, height: H, fill: '#fff' }, calques.fond);

  // Le mur de dessins qui défile : chaque dessin se peint au pinceau quand il entre dans l'image ; défilement de t0 à t0 + 10,6 s
  function defile(parent, noms, t0) {
    const camera = el('g', {}, parent);
    const ECART = 450, PAN = 380 + (noms.length - 1) * ECART - 1500; // le dernier dessin s'arrête à x = 1500
    const decalage = (t) => sinus(prog(t, t0, t0 + 10.6)) * PAN;
    const oeuvres = noms.map((nom, i) => {
      const x = 380 + i * ECART;
      let debut = t0 + 0.3 + i * 0.3; // le pinceau finit toujours avant la fin du défilement
      while (debut < t0 + 9.2 && x - decalage(debut) - 200 > W - 40) debut += 0.05;
      return { t: toile(camera, nom, 380, true), x, y: 120 + (i % 2 ? 34 : 0), pente: [-0.8, 0.6, -0.3, 0.9, -0.6, 0.4, -0.5][i % 7], debut };
    });
    return (t, opacite) => {
      camera.setAttribute('transform', `translate(${(-decalage(t)).toFixed(2)},0)`);
      oeuvres.forEach((a) => a.t.maj({ x: a.x, y: a.y, p: io(prog(t, a.debut, a.debut + 1.1)), pente: a.pente, opacite }));
    };
  }
  // Coupe une phrase en lignes d'au plus n signes
  const couper = (texte, n) => texte.split(' ').reduce((l, m) => {
    if (l.length && (l[l.length - 1] + ' ' + m).length <= n) l[l.length - 1] += ' ' + m; else l.push(m);
    return l;
  }, []);
  // Un dessin par univers (3 s chacun, à partir de t0) : le nom en gros à côté, sa phrase du site en dessous ;
  // le dernier reste pendant que le salon apparaît par-dessus
  function univers(parent, liste, t0) {
    const plans = liste.map(([nom, u], i) => {
      const a = t0 + i * 3, gauche = i % 2 === 0, cx = gauche ? W * 0.71 : W * 0.29;
      const phrase = el('g', {}, parent);
      const lignes = couper(T.phrases[u], 20).map((l, j) => mots(phrase, l, cx, 540 + j * 92, 78, { largeurMax: 860 }));
      return { a, gauche, t: toile(parent, nom, 470, true), nom: titre(parent, T.noms[u], cx, 380, 132, 760), phrase, lignes };
    });
    return (t) => plans.forEach((u, i) => {
      const derniere = i === plans.length - 1;
      const visible = t >= u.a - 0.3 && t < u.a + (derniere ? 3.2 : 3.1);
      montrer(u.t.g, visible); montrer(u.nom.g, visible); montrer(u.phrase, visible);
      if (!visible) return;
      const op = ss(prog(t, u.a - 0.3, u.a)) * (derniere ? 1 : 1 - ss(prog(t, u.a + 2.7, u.a + 3.0)));
      const opTexte = derniere ? 1 : 1 - ss(prog(t, u.a + 2.95, u.a + 3.1)); // le nom suivant est déjà là, de l'autre côté
      const k = prog(t, u.a - 0.3, u.a + 3.0);
      u.t.maj({ x: (u.gauche ? W * 0.29 : W * 0.71) + (k - 0.5) * 70 * (u.gauche ? 1 : -1), y: 120 - (k - 0.5) * 20, p: io(prog(t, u.a - 0.3, u.a + 0.8)), echelle: 1 + k * 0.05, pente: i % 2 ? 0.7 : -0.7, opacite: op });
      u.nom.maj(prog(t, u.a - 0.15, u.a + 0.65));
      u.lignes.forEach((l, j) => l.maj(prog(t, u.a + 0.5 + j * 0.25, u.a + 1.2 + j * 0.25)));
      u.nom.g.setAttribute('opacity', opTexte.toFixed(3)); u.phrase.setAttribute('opacity', opTexte.toFixed(3));
    });
  }
  // Le salon, en deux temps : un buffet bas en bois (vase, livres, bougie) sous le premier trio de toiles, puis un canapé
  // (dossier, accoudoirs, assise, pieds, deux coussins) sous le second. Même mur, même lampe, même plante. Les phrases passent
  // sur le mur nu, entre les toiles et les meubles.
  const contour = { stroke: VERT_NUIT, 'stroke-width': 6, 'stroke-linejoin': 'round' };
  const lueur = el('radialGradient', { id: 'lueur' }, defs);
  el('stop', { offset: 0, 'stop-color': '#ffe2a8', 'stop-opacity': 0.8 }, lueur);
  el('stop', { offset: 1, 'stop-color': '#ffe2a8', 'stop-opacity': 0 }, lueur);
  function buffet(parent) {
    el('rect', { x: 430, y: 1000, width: 22, height: 44, rx: 4, fill: '#8a5a33' }, parent);
    el('rect', { x: 1468, y: 1000, width: 22, height: 44, rx: 4, fill: '#8a5a33' }, parent);
    el('rect', { x: 400, y: 862, width: 1120, height: 146, rx: 14, fill: '#e0a868', ...contour }, parent);
    el('rect', { x: 380, y: 840, width: 1160, height: 32, rx: 10, fill: '#c98a4b', ...contour }, parent);
    [0, 1, 2, 3].forEach((i) => {
      const x = 420 + i * 272;
      el('rect', { x, y: 888, width: 248, height: 100, rx: 10, fill: '#ebb87c', stroke: '#b9773e', 'stroke-width': 4 }, parent);
      el('circle', { cx: x + (i % 2 ? 22 : 226), cy: 938, r: 8, fill: '#8a5a33' }, parent);
    });
    // un petit vase de fleurs, deux livres et une bougie
    el('path', { d: 'M520,842 C480,842 480,790 505,778 L535,778 C560,790 560,842 520,842 Z', fill: '#7cc3a4', ...contour }, parent);
    el('path', { d: 'M512,782 C502,770 488,762 470,756 M520,782 C528,770 545,760 570,754 M516,782 C516,775 516,768 518,758', stroke: '#2b6e3a', 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round' }, parent);
    [[470, 756], [570, 754], [518, 756], [490, 766], [550, 765]].forEach(([x, y], i) => el('circle', { cx: x, cy: y, r: 13, fill: i % 2 ? '#F28A1E' : '#FFB347' }, parent));
    el('rect', { x: 1300, y: 810, width: 170, height: 30, rx: 5, fill: '#3e9a47', stroke: VERT_NUIT, 'stroke-width': 4 }, parent);
    el('rect', { x: 1310, y: 786, width: 150, height: 24, rx: 5, fill: '#F28A1E', stroke: VERT_NUIT, 'stroke-width': 4 }, parent);
    el('rect', { x: 1365, y: 744, width: 40, height: 42, rx: 6, fill: '#fff', stroke: VERT_NUIT, 'stroke-width': 4 }, parent);
    el('path', { d: 'M1385,742 C1375,728 1390,720 1385,708 C1400,720 1397,734 1385,742 Z', fill: '#FFB347' }, parent);
  }
  function canape(parent) {
    const vert = '#6a9c76', clair = '#7fb08a', fonce = '#5a8a66';
    [440, 1480].forEach((x) => el('path', { d: `M${x - 14},996 L${x + 14},996 L${x + 8},1042 L${x - 8},1042 Z`, fill: '#8a5a33' }, parent));
    el('rect', { x: 470, y: 720, width: 980, height: 200, rx: 46, fill: vert, ...contour }, parent);
    el('rect', { x: 500, y: 742, width: 452, height: 160, rx: 40, fill: clair, ...contour }, parent);
    el('rect', { x: 968, y: 742, width: 452, height: 160, rx: 40, fill: clair, ...contour }, parent);
    el('rect', { x: 450, y: 892, width: 1020, height: 70, rx: 24, fill: vert, ...contour }, parent);
    el('rect', { x: 476, y: 876, width: 480, height: 62, rx: 24, fill: clair, ...contour }, parent);
    el('rect', { x: 964, y: 876, width: 480, height: 62, rx: 24, fill: clair, ...contour }, parent);
    el('rect', { x: 420, y: 950, width: 1080, height: 54, rx: 20, fill: fonce, ...contour }, parent);
    el('rect', { x: 380, y: 800, width: 130, height: 204, rx: 56, fill: vert, ...contour }, parent);
    el('rect', { x: 1410, y: 800, width: 130, height: 204, rx: 56, fill: vert, ...contour }, parent);
    el('path', { d: 'M400,850 C420,830 470,830 490,850 M1430,850 C1450,830 1500,830 1520,850', stroke: fonce, 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round' }, parent);
    el('rect', { x: 540, y: 770, width: 170, height: 150, rx: 34, fill: '#f6b26b', ...contour, transform: 'rotate(-8 625 845)' }, parent);
    el('rect', { x: 1210, y: 770, width: 170, height: 150, rx: 34, fill: '#fde3c3', ...contour, transform: 'rotate(7 1295 845)' }, parent);
  }
  // une pièce : le mur, la lampe allumée, le meuble, la plante, et trois toiles qui s'accrochent l'une après l'autre
  function piece(parent, meuble, noms, debut) {
    mur(parent, 0, 0, W, H);
    el('circle', { cx: 160, cy: 380, r: 300, fill: 'url(#lueur)' }, parent);
    el('ellipse', { cx: 160, cy: 1062, rx: 70, ry: 16, fill: '#5b4a3a' }, parent);
    el('path', { d: 'M160,1060 L160,380', stroke: '#5b4a3a', 'stroke-width': 10, 'stroke-linecap': 'round' }, parent);
    el('path', { d: 'M70,390 L250,390 L205,270 L115,270 Z', fill: '#ffd59a', ...contour }, parent);
    meuble(parent);
    [[-38, '#3e9a47'], [-12, '#2b6e3a'], [14, '#3e9a47'], [40, '#2b6e3a'], [-62, '#2b6e3a'], [64, '#3e9a47']].forEach(([a, c]) => {
      el('ellipse', { cx: 1790, cy: 760, rx: 34, ry: 120, fill: c, transform: `rotate(${a} 1790 880)` }, parent);
    });
    el('path', { d: 'M1720,880 L1860,880 L1840,1080 L1740,1080 Z', fill: '#c46b3a', ...contour }, parent);
    const grain = poussieres(parent, 20);
    const trio = noms.map((nom, i) => ({ t: toile(parent, nom, 260), x: [630, 960, 1290][i], debut: debut + i * 0.7, pente: [-0.6, 0.4, -0.3][i] }));
    return (t) => {
      grain(t, 1);
      trio.forEach((a) => {
        montrer(a.t.g, t >= a.debut);
        a.t.maj({ x: a.x, y: 80, p: io(prog(t, a.debut, a.debut + 1.1)), b: t - a.debut - 1.1, pente: a.pente });
      });
    };
  }

  // 0 – 4 : titre
  const intro = el('g', {}, calques.scene);
  const tombe = feuilles(intro, 9, 1);
  const lg = logo(intro);
  const bassinIntro = etang(intro, 905);
  const introTitre = mots(intro, T.titre, W / 2, 600, 250, { remplir: [BLANC, ORANGE, BLANC, ORANGE] });
  const introSous = mots(intro, T.sous, W / 2, 770, 120, { remplir: [BLANC, BLANC, ORANGE] });

  // 4 – 34 : les dessins, sur le fond blanc du titre avec l'étang : le mur qui défile (4 – 16), « Plusieurs univers imaginés
  // par Linda » (16 – 19), puis un dessin par univers avec sa phrase (19 – 34)
  const blanc = el('g', {}, calques.scene);
  el('rect', { width: W, height: H, fill: '#fff' }, blanc);
  const tombeD = feuilles(blanc, 7, 5);
  const bassinD = etang(blanc, 905);
  const murDessins = el('g', {}, blanc);
  const defileDessins = defile(murDessins, DESSINS_MUR, 4.0);
  const annonce = el('g', {}, blanc);
  const annonce1 = mots(annonce, T.univers[0], W / 2, 450, 190, { remplir: ORANGE });
  const annonce2 = mots(annonce, T.univers[1], W / 2, 640, 130);
  const dessinsUnivers = univers(blanc, DESSINS_UNIVERS, 19);

  // 34 – 46 : le salon, les toiles s'y accrochent et se balancent : le buffet (34 – 40,5), puis le canapé (40 – 46)
  const buffetG = el('g', {}, calques.scene);
  const buffetVie = piece(buffetG, buffet, TOILES_SALON[0], 34.4);
  const canapeG = el('g', {}, calques.scene);
  const canapeVie = piece(canapeG, canape, TOILES_SALON[1], 40.5);

  // 46 – 58 : la fin, sans toile : Tilleul arrive au bord de l'étang, quatre phrases du site, puis la signature de Linda Denise
  const fin = el('g', {}, calques.scene);
  el('rect', { width: W, height: H, fill: '#fff' }, fin);
  const tombeFin = feuilles(fin, 8, 3);
  const bassinFin = etang(fin, 830);
  fin.appendChild(porteChat);
  const phrasesFin = T.fin.map(([l1, l2], k) => {
    const g = el('g', {}, fin);
    return { g, a: [46.2, 48.8, 51.0, 53.4][k], b: [48.8, 51.0, 53.4, 56.05][k], l1: mots(g, l1, W / 2, 300, 130, { largeurMax: 1300 }), l2: mots(g, l2, W / 2, 440, 130, { largeurMax: 1300, remplir: ORANGE }) };
  });
  const signatureG = el('g', {}, fin);
  const lgFin = logo(signatureG);
  const masqueSignature = el('mask', { id: 'signature', maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: W, height: H }, defs);
  const plume = el('rect', { x: 440, y: 380, width: 0, height: 320, fill: '#fff' }, masqueSignature);
  const signature = el('text', { x: W / 2 - 60, y: 610, 'text-anchor': 'middle', 'font-size': 170, fill: VERT_NUIT, style: "font-family: 'Gochi Hand'", mask: 'url(#signature)' }, signatureG);
  signature.textContent = 'Linda Denise';
  const trait = el('path', { d: 'M500,655 C720,695 1060,635 1320,662', fill: 'none', stroke: '#F28A1E', 'stroke-width': 9, 'stroke-linecap': 'round', pathLength: 1, 'stroke-dasharray': '1 1', 'stroke-dashoffset': 1 }, signatureG);

  const legende = legendes(calques.texte, T.legendes, (a) => (a >= 34 && a < 46.2 ? { cy: 615, taille: 118, largeurMax: 1300 } : { cy: H - 118, taille: 128, largeurMax: W - 240 }));

  const rendre = (t) => {
    // titre
    montrer(intro, t < 4.4);
    if (t < 4.4) {
      tombe(t); bassinIntro(t);
      const k = outBack(prog(t, 0.2, 1.3));
      lg.setAttribute('transform', `translate(${W / 2},${270 + Math.sin(t * 1.2) * 6}) scale(${k * 0.95}) rotate(${(1 - k) * -40})`);
      introTitre.maj(prog(t, 0, 1.0)); introSous.maj(prog(t, 1.0, 2.0));
    }
    // les dessins (fondu depuis le titre)
    montrer(blanc, t >= 3.4 && t < 34.2);
    if (t >= 3.4 && t < 34.2) {
      blanc.setAttribute('opacity', ss(prog(t, 3.4, 4.2)).toFixed(3));
      tombeD(t); bassinD(t);
      montrer(murDessins, t < 16.3);
      if (t < 16.3) defileDessins(t, 1 - ss(prog(t, 15.6, 16.3)));
      montrer(annonce, t >= 16.0 && t < 19.0);
      if (t >= 16.0 && t < 19.0) {
        annonce1.maj(prog(t, 16.0, 16.8)); annonce2.maj(prog(t, 16.6, 17.4));
        annonce.setAttribute('opacity', (1 - ss(prog(t, 18.7, 18.9))).toFixed(3)); // juste avant le nom du premier univers
      }
      dessinsUnivers(t);
    }
    // le salon : le buffet (fondu depuis le dernier dessin), puis le canapé en fondu par-dessus
    montrer(buffetG, t >= 33.4 && t < 40.5);
    if (t >= 33.4 && t < 40.5) {
      buffetG.setAttribute('opacity', ss(prog(t, 33.4, 34.2)).toFixed(3));
      buffetVie(t);
    }
    montrer(canapeG, t >= 40.0 && t < 46.2);
    if (t >= 40.0 && t < 46.2) {
      canapeG.setAttribute('opacity', ss(prog(t, 40.0, 40.5)).toFixed(3));
      canapeVie(t);
    }
    // la fin
    montrer(fin, t >= 45.4);
    if (t >= 45.4) {
      fin.setAttribute('opacity', ss(prog(t, 45.4, 46.2)).toFixed(3));
      if (!chatPret) { chatEntre(1420, 1290); chatPret = true; }
      if (t > 50.0 && chat.etat !== 'assis') chat.ordre('assis');
      regarde(960, 400);
      tombeFin(t); bassinFin(t);
      porteChat.setAttribute('transform', `translate(-633,${830 - 276 * 1.7}) scale(1.7)`); // assis vers x = 1560, au bord de l'eau
      phrasesFin.forEach((f) => {
        const vis = t >= f.a && t < f.b;
        montrer(f.g, vis);
        if (!vis) return;
        f.l1.maj(prog(t, f.a, f.a + 0.6)); f.l2.maj(prog(t, f.a + 0.35, f.a + 1.0));
        f.g.setAttribute('opacity', (1 - ss(prog(t, f.b - 0.12, f.b))).toFixed(3));
      });
      montrer(signatureG, t >= 55.95);
      if (t >= 55.95) {
        lgFin.setAttribute('transform', `translate(${W / 2 - 60},${300}) scale(${(outBack(prog(t, 55.95, 56.75)) * 0.85).toFixed(4)})`);
        plume.setAttribute('width', (1000 * out(prog(t, 55.95, 57.1))).toFixed(1)); // la signature s'écrit de gauche à droite, dès la première image
        trait.setAttribute('stroke-dashoffset', (1 - io(prog(t, 57.1, 57.7))).toFixed(4));
      }
    }
    legende(t);
  };
  window.DUREE = 58;
  window.image = (t) => { avancer(1000 / 30); rendre(t); };

  const hrefs = [...new Set([...racine.querySelectorAll('image')].map((i) => i.getAttribute('href')).filter((h) => h.startsWith('file:')))];
  await Promise.all(hrefs.map((h) => new Promise((ok) => { const i = new Image(); i.onload = i.onerror = ok; i.src = h; })));
  return true;
})();
</script>
</body>
</html>
