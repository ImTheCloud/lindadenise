<!doctype html>
<!-- Scène de la vidéo « Dessins et toiles » (16:9, 56 s) : rendue image par image par rendu.mjs (voir l'en-tête de ce fichier-là). -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Lilita One'; src: url('./polices/lilita-one-latin-400-normal.woff2') format('woff2'); }
  html, body { margin: 0; padding: 0; background: #fff; overflow: hidden; }
  svg { display: block; }

<body>
<svg id="racine" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const P = new URLSearchParams(location.search);
const LANG = P.get('lang') || 'fr';
const W = 1920, H = 1080;
const REPO = new URL('../..', location.href).href.replace(/\/$/, '');
const NS = 'http://www.w3.org/2000/svg';
const racine = document.getElementById('racine');
racine.setAttribute('width', W); racine.setAttribute('height', H); racine.setAttribute('viewBox', `0 0 ${W} ${H}`);

const BLANC = '#fff', ORANGE = '#FFA52E', VERT_NUIT = '#1f5a2e';

// Textes (à l'écran : ni prix ni remise, rien sur Ostende, aucun chiffre ni « pièce unique »), repris du site. Il y a
// toujours un texte à l'écran. Légendes en bas : [début, fin, texte, en orange] ; univers : le gros texte à côté de chaque œuvre.
const T = {
  fr: {
    titre: 'Dessins et toiles', sous: 'de Linda Denise', fin: 'Dessins et toiles',
    univers: { chats: 'Les chats', nature: 'La nature', fleurs: 'Les fleurs', animaux: 'Les animaux', psaumes: 'Les psaumes' },
    legendes: [
      [4.2, 5.6, 'Des dessins', false], [5.6, 7.4, 'faits à la main,', true], [7.4, 9.6, 'sur son téléphone', true],
      [9.6, 26.0, 'Plusieurs univers', true],
      [26.0, 27.4, 'Aussi en', false], [27.4, 29.4, 'grand format', true], [29.4, 31.8, 'des dessins imprimés', false], [31.8, 34.6, 'sur aluminium', true],
      [34.6, 46.0, 'Plusieurs univers', true],
      [46.0, 48.0, 'Bienvenue', false], [48.0, 52.3, 'chez Linda', true],
    ],
  },
  nl: {
    titre: 'Tekeningen en doeken', sous: 'van Linda Denise', fin: 'Tekeningen en doeken',
    univers: { chats: 'De katten', nature: 'De natuur', fleurs: 'De bloemen', animaux: 'De dieren', psaumes: 'De psalmen' },
    legendes: [
      [4.2, 5.6, 'Tekeningen', false], [5.6, 7.4, 'met de hand gemaakt,', true], [7.4, 9.6, 'op haar telefoon', true],
      [9.6, 26.0, 'Meerdere werelden', true],
      [26.0, 27.4, 'Ook in', false], [27.4, 29.4, 'groot formaat', true], [29.4, 31.8, 'tekeningen gedrukt', false], [31.8, 34.6, 'op aluminium', true],
      [34.6, 46.0, 'Meerdere werelden', true],
      [46.0, 48.0, 'Welkom', false], [48.0, 52.3, 'bij Linda', true],
    ],
  },
}[LANG];

// Les œuvres montrées : aperçus filigranés des dessins numériques et photos des toiles (pas toutes : un choix varié)
const DESSINS_MUR = ['tiroux-et-les-arbres', 'tournesol', 'chapeau-de-soleil', 'paon-indien', 'tiroux-et-les-couleurs', 'trio-glaieuls',
  'time-grimpe', 'marrons', 'couleurs', 'soleil-couchant', 'arbre-rouge-et-lapins', 'trio-d-amaryllis'];
const DESSINS_UNIVERS = [['time-au-clair-de-lune', 'chats'], ['l-ile-de-brehat', 'nature'], ['lys-tigre', 'fleurs'], ['coccinelles', 'animaux'], ['plante-pres-du-ruisseau', 'psaumes']];
const TOILES_MUR = ['iris', 'mauves', 'le-tournesol', 'bouleaux-en-hiver', 'tournesols', 'sweet', 'jonquilles', 'fleurs-bleues', 'le-chemin-de-foret', 'montagne-et-tournesols'];
const TOILES_UNIVERS = [['chat-au-repos', 'chats'], ['bois-de-hal', 'nature'], ['narcisses', 'fleurs'], ['l-oiseau', 'animaux']];

// ---------- outils ----------
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const io = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const ss = (x) => x * x * (3 - 2 * x); // fondu doux, sans à-coup au début ni à la fin
const sinus = (x) => 0.5 - 0.5 * Math.cos(Math.PI * x);
const out = (x) => 1 - Math.pow(1 - x, 3);
const outBack = (x) => { const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function el(tag, attrs = {}, parent = racine) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
let uid = 0;
const id = (p) => `${p}${uid++}`;
const montrer = (g, v) => g.setAttribute('display', v ? 'inline' : 'none');

const defs = el('defs');
// texture d'enduit, calculée une seule fois
function texture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'); const img = x.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) { const v = 200 + Math.random() * 55; img.data[i] = v; img.data[i + 1] = v * 0.96; img.data[i + 2] = v * 0.88; img.data[i + 3] = 22; }
  x.putImageData(img, 0, 0); return c.toDataURL();
}
const motif = el('pattern', { id: 'enduit', width: 256, height: 256, patternUnits: 'userSpaceOnUse' }, defs);
el('image', { href: texture(), width: 256, height: 256 }, motif);
const ombre = el('filter', { id: 'ombre', x: '-20%', y: '-15%', width: '140%', height: '145%' }, defs);
el('feDropShadow', { dx: 0, dy: 14, stdDeviation: 16, 'flood-color': '#3a2a18', 'flood-opacity': 0.32 }, ombre);
const flou = el('filter', { id: 'flou', x: '-50%', y: '-50%', width: '200%', height: '200%' }, defs);
el('feGaussianBlur', { stdDeviation: 6 }, flou);
const gLumiere = el('radialGradient', { id: 'lumiere', cx: 0.5, cy: 0, r: 0.75 }, defs);
el('stop', { offset: 0, 'stop-color': '#fffaf0', 'stop-opacity': 0.95 }, gLumiere);
el('stop', { offset: 1, 'stop-color': '#fffaf0', 'stop-opacity': 0 }, gLumiere);

// Une toile accrochée à un clou : se peint au pinceau, puis se balance doucement.
// Un dessin (dessin = true) : même pinceau, dans la carte blanche au bord vert du site, sans clou.
function toile(parent, nom, largeur, dessin = false) {
  const l = largeur, h = Math.round(largeur * 420 / 297);
  const g = el('g', {}, parent);
  const corps = el('g', { filter: 'url(#ombre)' }, g);
  const masque = el('mask', { id: id('m'), maskUnits: 'userSpaceOnUse', x: -l, y: -h * 0.2, width: l * 3, height: h * 1.6 }, defs);
  // trait de pinceau en zigzag qui couvre la toile
  const rangs = 5, ep = h / rangs * 1.5;
  let d = '';
  for (let i = 0; i < rangs; i++) {
    const y = 18 + h * (i + 0.5) / rangs;
    const [a, b] = i % 2 ? [l * 1.08 - l / 2, -l * 1.08 + l / 2] : [-l * 0.58, l * 0.58];
    d += (i ? ` L${a},${y}` : `M${a},${y}`) + ` Q${(a + b) / 2},${y + (i % 2 ? -18 : 18)} ${b},${y}`;
  }
  const trait = el('path', { d, fill: 'none', stroke: '#fff', 'stroke-width': ep, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', pathLength: 1, 'stroke-dasharray': '1 1', 'stroke-dashoffset': 1 }, masque);
  const peint = el('g', { mask: `url(#${masque.id})` }, corps);
  let clou = null;
  if (dessin) {
    el('rect', { x: -l / 2 - 12, y: 6, width: l + 24, height: h + 24, rx: 18, fill: '#fff', stroke: '#2b6e3a', 'stroke-width': 6 }, peint);
    el('image', { href: `${REPO}/public/dessins/${nom}.webp`, x: -l / 2, y: 18, width: l, height: h, preserveAspectRatio: 'xMidYMid slice' }, peint);
  } else {
    el('rect', { x: -l / 2 - 3, y: 15, width: l + 6, height: h + 6, rx: 3, fill: '#c9ced2' }, peint);
    el('image', { href: `${REPO}/public/toiles/${nom}-800.webp`, x: -l / 2, y: 18, width: l, height: h, preserveAspectRatio: 'xMidYMid slice' }, peint);
    el('rect', { x: -l / 2, y: 18, width: l, height: h, fill: 'none', stroke: '#9aa2a8', 'stroke-width': 2 }, peint);
    clou = el('g', {}, g);
    el('circle', { cx: 1.5, cy: 3, r: 7, fill: '#000', opacity: 0.18, filter: 'url(#flou)' }, clou);
    el('circle', { cx: 0, cy: 0, r: 6.5, fill: '#9a9a9a' }, clou);
    el('circle', { cx: -1.8, cy: -1.8, r: 2.6, fill: '#fff', opacity: 0.85 }, clou);
  }
  return {
    l, h, g,
    // p : avancement du pinceau (0 à 1), b : temps depuis la fin de la peinture (balancement : il ne bouge pas avant)
    maj({ x, y, p = 1, b = 99, echelle = 1, pente = 0, opacite = 1 }) {
      const angle = pente + 4.5 * Math.exp(-Math.max(0, b) / 0.9) * Math.cos(Math.max(0, b) * 5.2);
      g.setAttribute('transform', `translate(${x.toFixed(2)},${y.toFixed(2)}) scale(${echelle.toFixed(4)})`);
      g.setAttribute('opacity', opacite.toFixed(3));
      corps.setAttribute('transform', `rotate(${angle.toFixed(3)})`);
      trait.setAttribute('stroke-dashoffset', (1 - p).toFixed(4));
      if (clou) clou.setAttribute('opacity', p > 0 ? 1 : 0);
    },
  };
}

// ---------- gros textes (style des vidéos courtes : gros titres qui sautent, mot après mot) ----------
// Chaque mot est dessiné deux fois (ombre dure, puis le mot avec son contour) et « saute » à son tour.
function mots(parent, texte, cx, cy, taille, { remplir = BLANC, contour = VERT_NUIT, largeurMax = W - 240 } = {}) {
  const g = el('g', {}, parent);
  const liste = texte.split(' ');
  const sonde = el('text', { 'font-size': taille }, g);
  const larg = liste.map((m) => { sonde.textContent = m; return sonde.getComputedTextLength(); });
  g.removeChild(sonde);
  const espace = taille * 0.28;
  const total = larg.reduce((a, b) => a + b, 0) + espace * (liste.length - 1);
  const k = Math.min(1, largeurMax / total);
  const t2 = taille * k;
  let x = cx - total * k / 2;
  const motsListe = liste.map((m, i) => {
    const mx = x + larg[i] * k / 2; x += (larg[i] + espace) * k;
    const mg = el('g', { opacity: 0 }, g);
    const attrs = { x: 0, y: 0, 'font-size': t2, 'text-anchor': 'middle', 'stroke-linejoin': 'round', 'stroke-width': t2 * 0.18, 'paint-order': 'stroke' };
    el('text', { ...attrs, fill: contour, stroke: contour, transform: `translate(0,${t2 * 0.08})` }, mg).textContent = m;
    el('text', { ...attrs, fill: Array.isArray(remplir) ? remplir[i] : remplir, stroke: contour }, mg).textContent = m;
    return { mg, mx, rot: i % 2 ? 3 : -3 };
  });
  return {
    g,
    maj(p) { // p : 0 (rien) à 1 (tous les mots posés)
      const n = motsListe.length;
      motsListe.forEach((w, i) => {
        const q = prog(p, (i / n) * 0.55, (i / n) * 0.55 + 0.45);
        w.mg.setAttribute('opacity', Math.min(1, q * 5).toFixed(3));
        w.mg.setAttribute('transform', `translate(${w.mx.toFixed(1)},${(cy + (1 - q) * 46).toFixed(1)}) rotate(${(w.rot * (1 - q)).toFixed(2)}) scale(${Math.max(0, outBack(q)).toFixed(4)})`);
      });
    },
  };
}

// Un titre sur une ou deux lignes (coupé au mot qui équilibre les deux lignes)
function titre(parent, texte, cx, cy, taille, largeurMax, remplir = BLANC) {
  const g = el('g', {}, parent);
  const m = texte.split(' ');
  let lignes = [texte];
  if (texte.length > 13 && m.length > 1) {
    let meilleur = 1;
    for (let s = 1; s < m.length; s++) if (Math.abs(m.slice(0, s).join(' ').length - m.slice(s).join(' ').length) < Math.abs(m.slice(0, meilleur).join(' ').length - m.slice(meilleur).join(' ').length)) meilleur = s;
    lignes = [m.slice(0, meilleur).join(' '), m.slice(meilleur).join(' ')];
  }
  const liste = lignes.map((l, j) => mots(g, l, cx, cy + (j - (lignes.length - 1) / 2) * taille * 1.02, taille, { largeurMax, remplir }));
  return { g, maj: (p) => liste.forEach((x, j) => x.maj(prog(p, j * 0.3, j * 0.3 + 0.7))) };
}

// Légendes : quelques mots à la fois, en bas de l'image, qui sautent puis s'effacent juste avant la suivante (jamais de vide)
function legendes(parent, morceaux) {
  const cy = H - 118;
  const liste = morceaux.map(([a, b, texte, accent]) => {
    const g = el('g', { display: 'none' }, parent);
    return { a, b, g, n: texte.split(' ').length, m: mots(g, texte, W / 2, cy, 128, { remplir: accent ? ORANGE : BLANC }) };
  });
  return (t) => liste.forEach(({ a, b, g, n, m }) => {
    const vis = t >= a && t < b;
    montrer(g, vis);
    if (!vis) return;
    m.maj(prog(t, a, a + 0.16 + 0.1 * n));
    const s = ss(prog(t, b - 0.12, b));
    g.setAttribute('opacity', (1 - s).toFixed(3));
    g.setAttribute('transform', `translate(${W / 2},${cy - 45}) scale(${(1 + 0.06 * s).toFixed(4)}) translate(${-W / 2},${-(cy - 45)})`);
  });
}

// ---------- décor ----------
const FEUILLE = 'M50,6 C64,28 88,40 83,64 C80,80 62,85 50,75 C38,85 20,80 17,64 C12,40 36,28 50,6 Z';
function feuilles(parent, n, seed) {
  const liste = [];
  for (let i = 0; i < n; i++) {
    const g = el('g', {}, parent);
    const c = ['#3E9A47', '#F28A1E', '#FFB347', '#2B6E3A'][(i + seed) % 4];
    el('path', { d: FEUILLE, fill: c }, g);
    el('path', { d: 'M50,74 L50,26 M50,56 L36,42 M50,56 L64,42', stroke: '#fff', 'stroke-width': 4, 'stroke-linecap': 'round', fill: 'none', opacity: 0.6 }, g);
    const k = (i * 9301 + seed * 49297) % 233280 / 233280;
    liste.push({ g, x0: (i + 0.5) / n * W + (k - 0.5) * 120, taille: 0.45 + k * 0.45, vitesse: 70 + k * 60, dephasage: k * 30, dx: 40 + k * 60 });
  }
  return (t) => liste.forEach((f) => {
    const y = ((t * f.vitesse + f.dephasage * 37) % (H + 200)) - 100;
    const x = f.x0 + Math.sin(t * 0.9 + f.dephasage) * f.dx;
    f.g.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(t * 40 + f.dephasage * 20) % 360} ) scale(${f.taille}) translate(-50,-50)`);
  });
}

const PET = 'M0,0 C-27,-18 -29,-60 0,-94 C29,-60 27,-18 0,0 Z';
const PETALES = [[-80, 0.78, '#FFB347'], [80, 0.78, '#FFB347'], [-52, 0.92, '#F28A1E'], [52, 0.92, '#F28A1E'], [-24, 1, '#F7992B'], [24, 1, '#F7992B'], [0, 1.06, '#F28A1E']];
function lotus(parent, x, y, s) {
  const g = el('g', {}, parent);
  el('ellipse', { cx: 0, cy: 6, rx: 95, ry: 20, fill: '#3e9a47' }, g);
  el('path', { d: 'M0,6 L95,0 L60,22 Z', fill: '#8fcfb4' }, g);
  for (const [a, k, c] of PETALES) {
    const p = el('g', { transform: `rotate(${a}) scale(${k})` }, g);
    el('path', { d: PET, fill: c }, p);
    el('path', { d: 'M0,-10 C-4,-36 -3,-62 0,-82', fill: 'none', stroke: '#FFD9A3', 'stroke-width': 3, 'stroke-linecap': 'round', opacity: 0.6 }, p);
  }
  return (t, ph) => g.setAttribute('transform', `translate(${x},${y + Math.sin(t * 1.3 + ph) * 5}) rotate(${Math.sin(t * 0.8 + ph) * 3}) scale(${s})`);
}
function etang(parent, y0) {
  const g = el('g', {}, parent);
  if (!document.getElementById('eau')) {
    const grad = el('linearGradient', { id: 'eau', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
    el('stop', { offset: 0, 'stop-color': '#bfe6d3' }, grad); el('stop', { offset: 1, 'stop-color': '#7cc3a4' }, grad);
  }
  const eau = el('path', { fill: 'url(#eau)' }, g);
  const roseaux = el('g', { stroke: '#2B6E3A', 'stroke-width': 6, 'stroke-linecap': 'round', fill: 'none' }, g);
  [[0.06, 1], [0.09, -1], [0.93, 1], [0.96, -1]].forEach(([fx, s]) => {
    const x = fx * W; el('path', { d: `M${x},${H} C${x - 6 * s},${y0 - 30} ${x + 8 * s},${y0 - 80} ${x},${y0 - 140}` }, roseaux);
    el('ellipse', { cx: x, cy: y0 - 150, rx: 9, ry: 24, fill: '#2B6E3A', stroke: 'none' }, roseaux);
  });
  const fleurs = [[0.22, 40, 0.55, 0], [0.5, 70, 0.8, 2], [0.78, 35, 0.6, 4]].map(([fx, dy, s, ph]) => [lotus(g, fx * W, y0 + dy, s), ph]);
  return (t) => {
    let d = `M0,${H} L0,${y0}`;
    for (let x = 0; x <= W; x += 40) d += ` L${x},${(y0 + Math.sin(x / 140 + t * 1.4) * 7).toFixed(1)}`;
    eau.setAttribute('d', d + ` L${W},${H} Z`);
    fleurs.forEach(([f, ph]) => f(t, ph));
  };
}

// Pan de mur dessiné (bord irrégulier), pour la scène de Tilleul
function panneau(parent, x, y, l, h) {
  const g = el('g', {}, parent);
  const d = `M${x},${y + 8} C${x + l * 0.3},${y - 6} ${x + l * 0.7},${y + 12} ${x + l},${y} C${x + l + 8},${y + h * 0.4} ${x + l - 6},${y + h * 0.7} ${x + l + 4},${y + h} C${x + l * 0.6},${y + h + 10} ${x + l * 0.3},${y + h - 8} ${x},${y + h + 4} C${x - 8},${y + h * 0.6} ${x + 6},${y + h * 0.3} ${x},${y + 8} Z`;
  el('path', { d, fill: '#f3eee4' }, g);
  el('path', { d, fill: 'url(#enduit)' }, g);
  el('path', { d, fill: 'url(#lumiere)', opacity: 0.9 }, g);
  const bord = el('path', { d, fill: 'none', stroke: '#2B6E3A', 'stroke-width': 5, 'stroke-linejoin': 'round', pathLength: 1, 'stroke-dasharray': '1 1' }, g);
  return (p) => bord.setAttribute('stroke-dashoffset', (1 - p).toFixed(4));
}

// Mur de galerie : enduit, lumière du haut, plinthe
function mur(parent, x, y, l, h) {
  const g = el('g', {}, parent);
  el('rect', { x, y, width: l, height: h, fill: '#f3eee4' }, g);
  el('rect', { x, y, width: l, height: h, fill: 'url(#enduit)' }, g);
  el('rect', { x, y, width: l, height: h * 0.8, fill: 'url(#lumiere)' }, g);
  el('rect', { x, y: y + h - 70, width: l, height: 30, fill: '#fdfcf9' }, g);
  el('rect', { x, y: y + h - 42, width: l, height: 4, fill: '#d9cfbf' }, g);
  el('rect', { x, y: y + h - 38, width: l, height: 38, fill: '#e6cba0' }, g);
  return g;
}

function logo(parent) {
  const g = el('g', {}, parent);
  el('image', { href: `${REPO}/public/favicon.svg`, x: -110, y: -110, width: 220, height: 220 }, g);
  return g;
}

// Grain de lumière : petites poussières dorées qui flottent dans la lumière
function poussieres(parent, n) {
  const l = [];
  for (let i = 0; i < n; i++) {
    const k = ((i * 7919) % 1000) / 1000;
    const c = el('circle', { r: 2 + k * 3.5, fill: '#ffe2a8', filter: 'url(#flou)' }, parent);
    l.push({ c, x: k * W, y: ((i * 3571) % 1000) / 1000 * H * 0.7, v: 6 + k * 14, ph: k * 20 });
  }
  return (t, op) => l.forEach((p) => {
    p.c.setAttribute('cx', (p.x + Math.sin(t * 0.3 + p.ph) * 40).toFixed(1));
    p.c.setAttribute('cy', ((p.y - t * p.v) % (H * 0.7) + H * 0.7) % (H * 0.7));
    p.c.setAttribute('opacity', (op * (0.35 + 0.35 * Math.sin(t * 1.7 + p.ph))).toFixed(3));
  });
}

// ================= Montage (construit une fois les polices chargées : les mots sont mesurés) =================
window.pret = (async () => {
  await document.fonts.load('80px "Lilita One"');

  // Tilleul : le moteur du site, inchangé
  const porteChat = el('g', {});
  const scene = el('svg', { width: W, height: 280, overflow: 'visible' }, porteChat);
  const chat = new Tilleul.Chat(scene, { decor: { lotus: () => [], feuilles: () => [] }, libre: true, reduit: false, dort: false, toucher() {}, taire() {}, suit() {} });
  scene.setAttribute('width', W); scene.setAttribute('height', 280);
  racine.removeChild(porteChat);
  let chatPret = false;
  // Positions dans le repère du moteur (largeur de l'écran, bande de 280 de haut)
  const chatEntre = (depart, cible) => { chat.ordre('assis'); chat.x = depart; chat.cibleX = cible; chat.etat = depart === cible ? 'assis' : 'marche'; };
  // Il suit le pointeur du regard : on « pointe » la toile
  const regarde = (x, y) => window.dispatchEvent(new PointerEvent('pointermove', { clientX: x, clientY: y }));

  const calques = { fond: el('g'), scene: el('g'), texte: el('g') };
  el('rect', { width: W, height: H, fill: '#fff' }, calques.fond);

  // Un mur qui défile (dessins sur fond blanc, ou toiles sur le mur de galerie) : chaque œuvre se peint au pinceau quand elle entre
  // dans l'image ; le défilement dure de t0 à t0 + 10,6 s
  function defile(parent, noms, dessin, t0) {
    const camera = el('g', {}, parent);
    const ECART = 450, PAN = 380 + (noms.length - 1) * ECART - 1500; // la dernière œuvre s'arrête à x = 1500
    if (!dessin) mur(camera, -200, -300, PAN + W + 400, H + 300);
    const decalage = (t) => sinus(prog(t, t0, t0 + 10.6)) * PAN;
    const oeuvres = noms.map((nom, i) => {
      const x = 380 + i * ECART;
      let debut = t0 + 0.3 + i * 0.3; // le pinceau finit toujours avant la fin du défilement
      while (debut < t0 + 9.2 && x - decalage(debut) - 200 > W - 40) debut += 0.05;
      return { t: toile(camera, nom, 380, dessin), x, y: 120 + (i % 2 ? 34 : 0), pente: [-0.8, 0.6, -0.3, 0.9, -0.6, 0.4, -0.5][i % 7], debut };
    });
    return (t, opacite) => {
      camera.setAttribute('transform', `translate(${(-decalage(t)).toFixed(2)},0)`);
      oeuvres.forEach((a) => a.t.maj({ x: a.x, y: a.y, p: io(prog(t, a.debut, a.debut + 1.1)), b: dessin ? 99 : t - a.debut - 1.1, pente: a.pente, opacite }));
    };
  }
  // Les œuvres une par une (une par mesure de 2 s, à partir de t0), le nom de l'univers en gros à côté ; la dernière reste
  // pendant que la partie suivante apparaît par-dessus
  function uneParUne(parent, liste, dessin, t0) {
    const plans = liste.map(([nom, univers], i) => {
      const a = t0 + i * 2, gauche = i % 2 === 0;
      return { a, gauche, t: toile(parent, nom, 470, dessin), nom: titre(parent, T.univers[univers], gauche ? W * 0.71 : W * 0.29, 500, 132, 700) };
    });
    return (t) => plans.forEach((u, i) => {
      const derniere = i === plans.length - 1;
      const visible = t >= u.a - 0.3 && t < u.a + (derniere ? 2.2 : 2.0);
      montrer(u.t.g, visible); montrer(u.nom.g, visible);
      if (!visible) return;
      const op = (i === 0 ? 1 : ss(prog(t, u.a - 0.3, u.a))) * (derniere ? 1 : 1 - ss(prog(t, u.a + 1.7, u.a + 2.0)));
      const k = prog(t, u.a - 0.3, u.a + 2.0);
      u.t.maj({ x: (u.gauche ? W * 0.29 : W * 0.71) + (k - 0.5) * 70 * (u.gauche ? 1 : -1), y: 120 - (k - 0.5) * 20, p: io(prog(t, u.a - 0.3, u.a + 0.8)), b: dessin ? 99 : t - u.a - 0.8, echelle: 1 + k * 0.07, pente: i % 2 ? 0.7 : -0.7, opacite: op });
      u.nom.maj(prog(t, u.a + 0.1, u.a + 0.9));
      u.nom.g.setAttribute('opacity', op.toFixed(3));
    });
  }

  // 0 – 4 : titre
  const intro = el('g', {}, calques.scene);
  const tombe = feuilles(intro, 9, 1);
  const lg = logo(intro);
  const bassinIntro = etang(intro, 905);
  const introTitre = mots(intro, T.titre, W / 2, 600, 250, { remplir: [ORANGE, BLANC, ORANGE] });
  const introSous = mots(intro, T.sous, W / 2, 770, 120, { remplir: [BLANC, BLANC, ORANGE] });

  // 4 – 26 : les dessins, sur le fond blanc du titre avec l'étang : un mur qui défile (4 – 16), puis un dessin par univers (16 – 26)
  const blanc = el('g', {}, calques.scene);
  el('rect', { width: W, height: H, fill: '#fff' }, blanc);
  const tombeD = feuilles(blanc, 7, 5);
  const bassinD = etang(blanc, 905);
  const murDessins = el('g', {}, blanc);
  const defileDessins = defile(murDessins, DESSINS_MUR, true, 4.0);
  const dessinsUnivers = uneParUne(blanc, DESSINS_UNIVERS, true, 16);

  // 26 – 38 : le mur de la galerie qu'on longe, les toiles s'y peignent et se balancent
  const galerie = el('g', {}, calques.scene);
  const defileToiles = defile(galerie, TOILES_MUR, false, 26.0);
  const grain = poussieres(galerie, 30);

  // 38 – 46 : une toile par univers, sur le mur
  const gros = el('g', {}, calques.scene);
  mur(gros, 0, 0, W, H);
  const toilesUnivers = uneParUne(gros, TOILES_UNIVERS, false, 38);

  // 46 – 52 : un nouveau mur ; Tilleul arrive et regarde la toile
  const nouveau = el('g', {}, calques.scene);
  el('rect', { width: W, height: H, fill: '#fff' }, nouveau);
  const tombe2 = feuilles(nouveau, 6, 3);
  const murDessine = panneau(nouveau, W * 0.22, 70, W * 0.42, 690);
  const seule = toile(nouveau, 'frangipanier', 330);
  const bassin = etang(nouveau, 830);
  nouveau.appendChild(porteChat);

  // 52 – 56 : fin (les textes restent jusqu'à la dernière image)
  const fin = el('g', {}, calques.scene);
  el('rect', { width: W, height: H, fill: '#fff' }, fin);
  const tombe4 = feuilles(fin, 9, 7);
  const bassinFin = etang(fin, 925);
  const lgFin = logo(fin);
  const finNom = mots(fin, 'Linda Denise', W / 2, 700, 190, { remplir: [BLANC, ORANGE] });
  const finSous = mots(fin, T.fin, W / 2, 860, 110);

  const legende = legendes(calques.texte, T.legendes);

  const rendre = (t) => {
    // titre
    montrer(intro, t < 4.4);
    if (t < 4.4) {
      tombe(t); bassinIntro(t);
      const k = outBack(prog(t, 0.2, 1.3));
      lg.setAttribute('transform', `translate(${W / 2},${270 + Math.sin(t * 1.2) * 6}) scale(${k * 0.95}) rotate(${(1 - k) * -40})`);
      introTitre.maj(prog(t, 0, 1.0)); introSous.maj(prog(t, 1.0, 2.0));
    }
    // les dessins (fondu depuis le titre)
    montrer(blanc, t >= 3.4 && t < 26.2);
    if (t >= 3.4 && t < 26.2) {
      blanc.setAttribute('opacity', ss(prog(t, 3.4, 4.2)).toFixed(3));
      tombeD(t); bassinD(t);
      montrer(murDessins, t < 16.3);
      if (t < 16.3) defileDessins(t, 1 - ss(prog(t, 15.6, 16.3))); // il s'efface pendant que le premier dessin se peint
      dessinsUnivers(t);
    }
    // le mur des toiles (fondu depuis le dernier dessin)
    montrer(galerie, t >= 25.4 && t < 38.3);
    if (t >= 25.4 && t < 38.3) {
      galerie.setAttribute('opacity', ss(prog(t, 25.4, 26.2)).toFixed(3));
      defileToiles(t, 1 - ss(prog(t, 37.5, 38.2)));
      grain(t, 1 - ss(prog(t, 37.5, 38.2)));
    }
    // une toile par univers (le mur apparaît sur les toiles qui défilent encore)
    montrer(gros, t >= 37.3 && t < 46.2);
    if (t >= 37.3 && t < 46.2) {
      gros.setAttribute('opacity', ss(prog(t, 37.3, 38.1)).toFixed(3));
      toilesUnivers(t);
    }
    // nouveau mur
    montrer(nouveau, t >= 45.4 && t < 52.2);
    if (t >= 45.4 && t < 52.2) {
      nouveau.setAttribute('opacity', ss(prog(t, 45.4, 46.2)).toFixed(3));
      if (!chatPret) { chatEntre(1420, 1207); chatPret = true; }
      if (t > 50.2 && chat.etat !== 'assis') chat.ordre('assis');
      regarde(970, 780);
      tombe2(t);
      murDessine(io(prog(t, 45.6, 46.8)));
      seule.maj({ x: W * 0.43, y: 150, p: io(prog(t, 46.2, 47.3)), b: t - 47.3, pente: -0.5 });
      bassin(t);
      porteChat.setAttribute('transform', `translate(-1190,${826 - 276 * 2.1}) scale(2.1)`);
    }
    // fin
    montrer(fin, t >= 51.4);
    if (t >= 51.4) {
      fin.setAttribute('opacity', ss(prog(t, 51.4, 52.2)).toFixed(3));
      tombe4(t); bassinFin(t);
      lgFin.setAttribute('transform', `translate(${W / 2},${400}) scale(${outBack(prog(t, 52.0, 53.0)) * 1.1})`);
      finNom.maj(prog(t, 52.0, 52.9)); finSous.maj(prog(t, 52.8, 53.6));
    }
    legende(t);
  };
  window.DUREE = 56;
  window.image = (t) => { avancer(1000 / 30); rendre(t); };

  const hrefs = [...new Set([...racine.querySelectorAll('image')].map((i) => i.getAttribute('href')).filter((h) => h.startsWith('file:')))];
  await Promise.all(hrefs.map((h) => new Promise((ok) => { const i = new Image(); i.onload = i.onerror = ok; i.src = h; })));
  return true;
})();
</script>
</body>
</html>
