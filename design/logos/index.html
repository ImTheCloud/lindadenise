<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pistes de logo - Linda Denise</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:24px 16px;background:#fff;font-family:system-ui,sans-serif;color:#2b2b2b}
h1{font-size:22px;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
figure{margin:0;border:1px solid #eee;border-radius:14px;padding:18px 12px;text-align:center}
img{width:150px;height:150px}
.nom{font-family:Caveat,cursive;font-size:34px;color:#2B6E3A;line-height:1}
.nom b{color:#F28A1E;font-weight:600}
.n{font-size:13px;color:#888;margin-top:8px}
</style></head><body>
<h1>Pistes de logo, Linda Denise</h1>
<div class="grid">
<figure><img src="01-lotus.svg" alt=""><div class="nom">Linda <b>Denise</b></div><div class="n">1 · Lotus</div></figure>
<figure><img src="02-lotus-badge.svg" alt=""><div class="nom">Linda <b>Denise</b></div><div class="n">2 · Lotus en pastille</div></figure>
<figure><img src="03-monogramme-ld.svg" alt=""><div class="nom">Linda <b>Denise</b></div><div class="n">3 · Lettres LD</div></figure>
<figure><img src="04-monogramme-badge.svg" alt=""><div class="nom">Linda <b>Denise</b></div><div class="n">4 · LD en pastille</div></figure>
<figure><img src="05-tilleul.svg" alt=""><div class="nom">Linda <b>Denise</b></div><div class="n">5 · Feuille de tilleul</div></figure>
<figure><img src="06-ecureuil.svg" alt=""><div class="nom">Linda <b>Denise</b></div><div class="n">6 · Écureuil</div></figure>
<figure><img src="07-ecureuil-feuille.svg" alt=""><div class="nom">Linda <b>Denise</b></div><div class="n">7 · Écureuil sur le tilleul</div></figure>
<figure><img src="08-lotus-tilleul.svg" alt=""><div class="nom">Linda <b>Denise</b></div><div class="n">8 · Lotus en feuilles de tilleul</div></figure>
</div></body></html>
